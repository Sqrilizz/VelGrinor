name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate release metadata
        run: node scripts/validate-release.mjs "${RELEASE_TAG}"
      - name: Validate required release secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VELGRINOR_MS_CLIENT_ID: ${{ secrets.VELGRINOR_MS_CLIENT_ID || secrets.SHARD_MS_CLIENT_ID }}
          VELGRINOR_CURSEFORGE_API_KEY: ${{ secrets.VELGRINOR_CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$VELGRINOR_MS_CLIENT_ID" || { echo "VELGRINOR_MS_CLIENT_ID is required" >&2; exit 1; }
          test -n "$VELGRINOR_CURSEFORGE_API_KEY" || { echo "VELGRINOR_CURSEFORGE_API_KEY is required" >&2; exit 1; }

  build-cli:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: velgrinor-cli-macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: velgrinor-cli-macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: velgrinor-cli-windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: velgrinor-cli-linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build CLI
        env:
          VELGRINOR_MS_CLIENT_ID: ${{ secrets.VELGRINOR_MS_CLIENT_ID || secrets.SHARD_MS_CLIENT_ID }}
          VELGRINOR_CURSEFORGE_API_KEY: ${{ secrets.VELGRINOR_CURSEFORGE_API_KEY }}
          VELGRINOR_DISCORD_APP_ID: "1521208567036645426"
        run: cargo build --release --target ${{ matrix.target }} -p velgrinor

      - name: Prepare artifact (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/velgrinor dist/
          cd dist && tar -czvf ../${{ matrix.artifact }}.tar.gz velgrinor

      - name: Prepare artifact (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/velgrinor.exe dist/
          Compress-Archive -Path dist/velgrinor.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  build-desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate translations
        working-directory: desktop
        run: npm run i18n:check

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VELGRINOR_MS_CLIENT_ID: ${{ secrets.VELGRINOR_MS_CLIENT_ID || secrets.SHARD_MS_CLIENT_ID }}
          VELGRINOR_CURSEFORGE_API_KEY: ${{ secrets.VELGRINOR_CURSEFORGE_API_KEY }}
          VELGRINOR_DISCORD_APP_ID: "1521208567036645426"
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Rename artifacts for clarity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renamed-artifacts
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          copy_one() {
            pattern="$1"
            destination="$2"
            matches="$(find "$bundle_dir" -type f -name "$pattern")"
            count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              echo "Expected one $pattern artifact, found $count" >&2
              exit 1
            fi
            cp "$matches" "renamed-artifacts/$destination"
          }
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            copy_one "*.dmg" "velgrinor-launcher-${{ matrix.name }}.dmg"
            copy_one "*.app.tar.gz" "velgrinor-launcher-${{ matrix.name }}.app.tar.gz"
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            copy_one "*.msi" "velgrinor-launcher-${{ matrix.name }}.msi"
            copy_one "*-setup.exe" "velgrinor-launcher-${{ matrix.name }}-setup.exe"
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            copy_one "*.AppImage" "velgrinor-launcher-${{ matrix.name }}.AppImage"
            copy_one "*.deb" "velgrinor-launcher-${{ matrix.name }}.deb"
          fi

      - name: Collect updater signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renamed-artifacts
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          copy_one() {
            pattern="$1"
            destination="$2"
            matches="$(find "$bundle_dir" -type f -name "$pattern")"
            count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              echo "Expected one $pattern signature, found $count" >&2
              exit 1
            fi
            cp "$matches" "renamed-artifacts/$destination"
          }
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            copy_one "*.app.tar.gz.sig" "velgrinor-launcher-${{ matrix.name }}.app.tar.gz.sig"
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            copy_one "*.msi.sig" "velgrinor-launcher-${{ matrix.name }}.msi.sig"
            copy_one "*-setup.exe.sig" "velgrinor-launcher-${{ matrix.name }}-setup.exe.sig"
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            copy_one "*.AppImage.sig" "velgrinor-launcher-${{ matrix.name }}.AppImage.sig"
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: renamed-artifacts/*
          if-no-files-found: error

  release:
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Validate release artifacts
        working-directory: release-files
        run: |
          set -euo pipefail
          for file in \
            velgrinor-cli-macos-arm64.tar.gz \
            velgrinor-cli-macos-x64.tar.gz \
            velgrinor-cli-windows-x64.zip \
            velgrinor-cli-linux-x64.tar.gz \
            velgrinor-launcher-macos-arm64.dmg \
            velgrinor-launcher-macos-arm64.app.tar.gz \
            velgrinor-launcher-macos-arm64.app.tar.gz.sig \
            velgrinor-launcher-macos-x64.dmg \
            velgrinor-launcher-macos-x64.app.tar.gz \
            velgrinor-launcher-macos-x64.app.tar.gz.sig \
            velgrinor-launcher-windows-x64.msi \
            velgrinor-launcher-windows-x64.msi.sig \
            velgrinor-launcher-windows-x64-setup.exe \
            velgrinor-launcher-windows-x64-setup.exe.sig \
            velgrinor-launcher-linux-x64.AppImage \
            velgrinor-launcher-linux-x64.AppImage.sig \
            velgrinor-launcher-linux-x64.deb; do
            test -s "$file" || { echo "Missing or empty artifact: $file" >&2; exit 1; }
          done

      - name: Build updater manifest
        working-directory: release-files
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const tag = process.env.TAG;
          const version = tag.startsWith("v") ? tag.slice(1) : tag;
          const baseUrl = `https://github.com/Sqrilizz/VelGrinor/releases/download/${tag}`;

          const readSig = (file) => fs.readFileSync(file, "utf8").trim();

          const manifest = {
            version,
            notes: "",
            platforms: {
              "darwin-aarch64": {
                url: `${baseUrl}/velgrinor-launcher-macos-arm64.app.tar.gz`,
                signature: readSig("velgrinor-launcher-macos-arm64.app.tar.gz.sig")
              },
              "darwin-x86_64": {
                url: `${baseUrl}/velgrinor-launcher-macos-x64.app.tar.gz`,
                signature: readSig("velgrinor-launcher-macos-x64.app.tar.gz.sig")
              },
              "linux-x86_64": {
                url: `${baseUrl}/velgrinor-launcher-linux-x64.AppImage`,
                signature: readSig("velgrinor-launcher-linux-x64.AppImage.sig")
              },
              "windows-x86_64": {
                url: `${baseUrl}/velgrinor-launcher-windows-x64-setup.exe`,
                signature: readSig("velgrinor-launcher-windows-x64-setup.exe.sig")
              }
            }
          };

          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Generate checksums
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          name: VelGrinor ${{ env.RELEASE_TAG }}
          body: |
            ## Desktop App (VelGrinor)

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | [`velgrinor-launcher-macos-arm64.dmg`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-macos-arm64.dmg) |
            | macOS (Intel) | [`velgrinor-launcher-macos-x64.dmg`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-macos-x64.dmg) |
            | Windows (installer) | [`velgrinor-launcher-windows-x64.msi`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-windows-x64.msi) |
            | Windows (setup) | [`velgrinor-launcher-windows-x64-setup.exe`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-windows-x64-setup.exe) |
            | Linux (AppImage) | [`velgrinor-launcher-linux-x64.AppImage`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-linux-x64.AppImage) |
            | Linux (Debian) | [`velgrinor-launcher-linux-x64.deb`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-launcher-linux-x64.deb) |

            ## CLI

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | [`velgrinor-cli-macos-arm64.tar.gz`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-cli-macos-arm64.tar.gz) |
            | macOS (Intel) | [`velgrinor-cli-macos-x64.tar.gz`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-cli-macos-x64.tar.gz) |
            | Windows | [`velgrinor-cli-windows-x64.zip`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-cli-windows-x64.zip) |
            | Linux | [`velgrinor-cli-linux-x64.tar.gz`](https://github.com/Sqrilizz/VelGrinor/releases/download/${{ env.RELEASE_TAG }}/velgrinor-cli-linux-x64.tar.gz) |

            ## Installation

            ### Desktop App

            **macOS**: Download the `.dmg`, open it, and drag VelGrinor to Applications.

            **Windows**: Run the `.msi` installer or the setup `.exe`.

            **Linux**: Make the `.AppImage` executable (`chmod +x`) and run, or install the `.deb` package.

            ### CLI

            **macOS/Linux**:
            ```bash
            tar -xzf velgrinor-cli-*.tar.gz
            sudo mv velgrinor /usr/local/bin/
            ```

            **Windows**: Extract the `.zip` and add `velgrinor.exe` to your PATH.

            ## Checksums

            See `SHA256SUMS.txt` for file integrity verification.
          files: release-files/*
